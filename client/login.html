<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Iniciar sesión - Sistema de Tickets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/components.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="auth-title">
            <header class="auth-header">
                <div class="brand-mark" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                        <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
                        <path d="M13 5v2"/>
                        <path d="M13 17v2"/>
                        <path d="M13 11v2"/>
                    </svg>
                </div>
                <h1 id="auth-title">Sistema de Tickets</h1>
                <p>Ingresá tus credenciales para acceder</p>
            </header>

            <form id="login-form">
                <div class="field">
                    <label for="contacto">Email / Contacto</label>
                    <input class="input" id="contacto" name="contacto" type="email" placeholder="ejemplo@correo.com" autocomplete="username" spellcheck="false" required>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="input-group">
                        <input class="input" id="password" name="password" type="password" placeholder="Ingresá tu contraseña" autocomplete="current-password" required>
                        <button class="input-toggle" type="button" data-password-toggle="password" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                <line x1="2" x2="22" y1="2" y2="22"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input id="terms" name="terms" type="checkbox" required>
                    <label for="terms">Acepto los Términos y Condiciones del servicio</label>
                </div>

                <div id="message" class="message" aria-live="polite"></div>

                <button class="btn btn-primary btn-block" type="submit">Iniciar sesión</button>
            </form>

            <div class="auth-links">
                <a class="link-primary" href="register.html">¿No tenés cuenta? Registrate</a>
                <a href="forgotPassword.html">¿Olvidaste tu contraseña?</a>
            </div>
        </section>

        <p class="auth-footer">Sistema de gestión de reclamos</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
