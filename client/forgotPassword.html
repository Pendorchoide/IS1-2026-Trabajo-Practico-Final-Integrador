<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Sistema de Tickets de Reclamos</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="icon">🔑</div>
            <h1>Recuperar Contraseña</h1>
            <p>Ingresa tu email y nueva contraseña</p>
        </div>
        <form id="forgot-form">
            <div class="form-group">
                <label for="contacto">Email / Contacto</label>
                <input id="contacto" name="contacto" type="email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label for="newPassword">Nueva Contraseña</label>
                <input id="newPassword" name="newPassword" type="password" placeholder="Ingresa nueva contraseña" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Nueva Contraseña</label>
                <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirma nueva contraseña" required>
            </div>
            <div id="message" class="message"></div>
            <button type="submit" class="btn">Cambiar Contraseña</button>
        </form>
        <div class="auth-links">
            <a href="login.html">Volver al Login</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script type="module" src="js/forgotPassword.js"></script>
</body>
</html>
